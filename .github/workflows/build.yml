name: Build TB-J606F ReSukiSU Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核源码分支'
        required: false
        default: 'lineage-19.1'
      root_branch:
        description: 'ReSukiSU 分支（留空用最新 tag）'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 检出本工程（workflow 用）
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make \
            gcc-aarch64-linux-gnu build-essential python3 rsync curl \
            unzip libelf-dev dwarves ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 拉取内核源码 (${{ github.event.inputs.kernel_branch }})
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch || 'lineage-19.1' }}" \
            https://github.com/adazem009/kernel_lenovo_tbj606.git kernel
          cd kernel
          echo "内核版本: $(make kernelversion 2>/dev/null || echo unknown)"
          echo "存在 TBJ606_defconfig: $(test -f arch/arm64/configs/vendor/TBJ606_defconfig && echo yes || echo no)"

      - name: 集成 ReSukiSU
        run: |
          cd kernel
          curl -fsSL "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" -o /tmp/rksu.sh
          if [ ! -s /tmp/rksu.sh ]; then
            echo "::error::ReSukiSU setup.sh 下载失败，终止"; exit 1
          fi
          bash /tmp/rksu.sh "${{ github.event.inputs.root_branch || 'main' }}"
          echo "--- drivers/Makefile 中 KSU 行 ---"
          grep -n "kernelsu" drivers/Makefile || true

      - name: 修复 Python2 编译包装脚本（gcc-wrapper.py）
        run: |
          bash configs/fix-gcc-wrapper.sh kernel

      - name: 生成设备 defconfig（基于源码自带 TBJ606_defconfig）
        run: |
          cd kernel
          SRC=arch/arm64/configs/vendor/TBJ606_defconfig
          if [ ! -f "$SRC" ]; then
            echo "::error::源码里找不到 $SRC，可能分支不对"; exit 1
          fi
          cp "$SRC" arch/arm64/configs/tbj606f_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- tbj606f_defconfig
          # 解析新符号，避免编译时卡在询问
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: 开启 Root 必需选项（逐项存在才改，不存在跳过）
        run: |
          cd kernel
          D=arch/arm64/configs/tbj606f_defconfig
          enable() { scripts/config --file "$D" -e "$1" 2>/dev/null || true; }
          disable() { scripts/config --file "$D" -d "$1" 2>/dev/null || true; }
          # Root 基础
          enable CONFIG_KALLSYMS
          enable CONFIG_KALLSYMS_ALL
          enable CONFIG_KALLSYMS_BASE_RELATIVE
          enable CONFIG_MODULES
          # ReSukiSU / KernelSU
          # Kbuild 判定顺序是 if/else 链：TRACEPOINT_HOOK -> MANUAL_HOOK -> SUSFS
          # TRACEPOINT_HOOK 在 Kconfig 里默认 =y，且只对 GKI 2.0 有效，
          # 非 GKI 一旦命中就直接 $(error)，必须先关掉才会落到 MANUAL_HOOK。
          enable CONFIG_KSU
          disable CONFIG_KSU_TRACEPOINT_HOOK
          enable CONFIG_KSU_MANUAL_HOOK
          enable CONFIG_KPM
          enable CONFIG_SUSFS
          # 关掉强制模块签名，避免自编译模块被拒
          disable CONFIG_MODULE_SIG_FORCE
          disable CONFIG_MODULE_SIG_ALL
          disable CONFIG_MODULE_SIG
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "=== 关键项（最终 .config）==="
          grep -E "CONFIG_KSU|CONFIG_KPM|CONFIG_SUSFS|CONFIG_KALLSYMS_ALL|CONFIG_MODULE_SIG_FORCE" .config || true
          echo "=== hook 方式校验（必须只剩 MANUAL_HOOK=y）==="
          grep -E "^CONFIG_KSU_(TRACEPOINT_HOOK|MANUAL_HOOK|SUSFS)=" .config || echo "（警告：三个 hook 符号一个都没开！）"

      - name: 编译内核（完整日志 + 修 -fno-common）
        run: |
          cd kernel
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=tbj606f
          export KBUILD_BUILD_HOST=reSukiSU
          # 1) GCC10+ 默认 -fno-common，老内核(KernelSU/ReSukiSU 补丁)常触发 multiple definition 链接失败
          # 2) 老 vendor 代码在 GCC11 下大量 maybe-uninitialized 被 -Werror 抬成错误，降级为普通告警
          KC_BASE="-fcommon -Wno-error -Wno-maybe-uninitialized -Wno-error=maybe-uninitialized"
          # 3) techpack 的头文件大量依赖各自目录的 -I（如 techpack/display/pll/pll_trace.h、
          #    techpack/camera/drivers/cam_req_mgr/cam_req_mgr_core.h）。
          #    这些 -I 在 AOSP/LineageOS 的 build.config 里由设备 BoardConfig 提供，
          #    裸 make 拿不到 -> fatal error: No such file or directory。
          #    这里把 techpack 下所有含 .h 的目录全部注入 -I，一次性覆盖。
          export INCS
          INCS=$(find techpack -name '*.h' -printf '%h\n' 2>/dev/null | sort -u | sed "s|^|-I$(pwd)/|" | tr '\n' ' ')
          echo "注入 -I 目录数: $(echo "$INCS" | wc -w)"
          export KCFLAGS="$KC_BASE $INCS"
          export HOSTCFLAGS="-fcommon -Wno-error"
          export KCPPFLAGS="-fcommon"
          LOG="$RUNNER_TEMP/build.log"
          if make -j"$(nproc)" Image.gz-dtb 2>&1 | tee "$LOG"; then
            echo "[+] Image.gz-dtb 构建完成"
          else
            echo "::error::make Image.gz-dtb 失败，关键错误如下："
            grep -iE "error:|multiple definition|undefined reference|No rule to make|recipe for target|Stop\.|fatal error" "$LOG" | tail -40
            echo "[*] 退回 Image + dtbs"
            make -j"$(nproc)" Image dtbs 2>&1 | tee -a "$LOG"
          fi
          echo "=== boot 目录产物 ==="
          ls -la arch/arm64/boot/ || true
          echo "=== 生成的 dtb ==="
          find arch/arm64/boot/dts -name '*.dtb' 2>/dev/null | head -20 || true

      - name: 组装 Image.gz-dtb（必要时手动追加 dtb）
        id: locate
        run: |
          cd kernel/arch/arm64/boot
          IMG=""
          for f in Image.gz-dtb Image.lz4-dtb Image-dtb; do
            if [ -f "$f" ]; then IMG="$f"; break; fi
          done
          if [ -z "$IMG" ]; then
            # 没有现成的 appended-dtb 镜像，尝试手动拼
            KERNEL=""
            for f in Image.gz Image.lz4 Image; do
              if [ -f "$f" ]; then KERNEL="$f"; break; fi
            done
            if [ -z "$KERNEL" ]; then
              echo "::error::连裸 Image 都没生成，编译实际失败（完整日志见 build.log 产物）"; exit 1
            fi
            if [ "$KERNEL" = "Image" ]; then gzip -kf Image && KERNEL=Image.gz; fi
            DTB=$(find "$PWD/../dts" -name '*.dtb' 2>/dev/null | grep -iE "tbj606|j606|m11" | head -1)
            [ -z "$DTB" ] && DTB=$(find "$PWD/../dts" -name '*.dtb' 2>/dev/null | head -1)
            if [ -z "$DTB" ]; then
              echo "::error::找不到任何 .dtb，无法组装"; exit 1
            fi
            echo "[*] 用 $KERNEL + $DTB 组装 Image.gz-dtb"
            cp "$KERNEL" Image.gz-dtb
            cat "$DTB" >> Image.gz-dtb
            IMG=Image.gz-dtb
          fi
          echo "选中的镜像: $IMG"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          cp "$IMG" "$RUNNER_TEMP/Image_final"
          ls -la "$RUNNER_TEMP/Image_final"

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          cp "$RUNNER_TEMP/Image_final" ak3/Image.gz-dtb
          cp "$GITHUB_WORKSPACE/configs/anykernel.sh" ak3/anykernel.sh
          cd ak3 && zip -r9 ../AnyKernel3-ReSukiSU-tbj606f.zip . -x '*.git*' 'README.md'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ReSukiSU-tbj606f
          path: |
            AnyKernel3-ReSukiSU-tbj606f.zip
            kernel/arch/arm64/boot/Image*
            ${{ runner.temp }}/build.log
          retention-days: 30

      - name: 输出摘要
        run: |
          echo "### TB-J606F ReSukiSU 编译完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 内核分支: ${{ github.event.inputs.kernel_branch || 'lineage-19.1' }}" >> $GITHUB_STEP_SUMMARY
          echo "- ReSukiSU 分支: ${{ github.event.inputs.root_branch || 'main' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 内核镜像: ${{ steps.locate.outputs.img }}" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: AnyKernel3-ReSukiSU-tbj606f.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**AK3 zip 不能直接 \`fastboot boot\`（缺 ramdisk）。正确验证见 README：先用 TWRP 备份原厂 boot 两槽，再拿备份 ramdisk 拼测试 boot.img 用 \`fastboot boot\` 试，能进系统才 flash。**" >> $GITHUB_STEP_SUMMARY
